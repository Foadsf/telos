name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for snapshot commits made by the tests
        run: |
          git config --global user.name "telos-ci"
          git config --global user.email "telos-ci@users.noreply.github.com"
      - name: Install
        run: python -m pip install -e ".[dev]" ruff
      - name: Lint
        run: ruff check --select F,E9 src tests
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
